---
- name: Build Kafka Connect image
  ansible.builtin.command:
    cmd: docker build -t kafka-connect-clickhouse:1.0 {{ playbook_dir }}/kafka-connect
  changed_when: true

- name: Deploy Kafka Connect
  ansible.builtin.command:
    cmd: kubectl apply -f {{ playbook_dir }}/kafka-connect/kafka-connect.yml
  become: false
  changed_when: true

- name: Wait for Kafka Connect
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/kafka-connect -n kafka --timeout=10m
  become: false
  changed_when: false

- name: Register ClickHouse connectors
  ansible.builtin.shell: |
    kubectl port-forward -n kafka svc/kafka-connect 18083:8083 >/tmp/kafka-connect-pf.log 2>&1 &
    PF_PID=$!

    sleep 5

    timeout 120s env \
      KAFKA_CONNECT_URL=http://127.0.0.1:18083 \
      CLICKHOUSE_HOST=clickhouse-clickhouse.clickhouse.svc.cluster.local \
      CLICKHOUSE_DATABASE=analytics \
      {{ playbook_dir }}/kafka-connect/register-connectors.sh

    RESULT=$?
    kill $PF_PID || true
    exit $RESULT
  become: false
  changed_when: true
