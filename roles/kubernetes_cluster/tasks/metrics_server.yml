---
- name: Install Metrics Server
  ansible.builtin.command:
    cmd: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
  become: false
  changed_when: true

- name: Allow Metrics Server to read kubelet metrics
  ansible.builtin.shell: |
    kubectl patch deployment metrics-server \
      -n kube-system \
      --type='json' \
      -p='[
        {
          "op":"add",
          "path":"/spec/template/spec/containers/0/args/-",
          "value":"--kubelet-insecure-tls"
        }
      ]'
  become: false
  changed_when: true

- name: Wait for Metrics Server
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/metrics-server -n kube-system --timeout=5m
  become: false
  changed_when: false
