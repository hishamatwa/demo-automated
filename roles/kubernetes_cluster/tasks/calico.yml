---
- name: Create Calico API bootstrap configuration
  ansible.builtin.copy:
    dest: /tmp/calico-bootstrap.yml
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: tigera-operator

      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kubernetes-services-endpoint
        namespace: tigera-operator
      data:
        KUBERNETES_SERVICE_HOST: "192.168.8.145"
        KUBERNETES_SERVICE_PORT: "6443"

- name: Apply Calico API bootstrap configuration
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/calico-bootstrap.yml
  become_user: aeyetech

- name: Install Calico CRDs
  ansible.builtin.command:
    cmd: kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.1/manifests/v1_crd_projectcalico_org.yaml
  become_user: aeyetech

- name: Install Calico operator
  ansible.builtin.command:
    cmd: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.1/manifests/tigera-operator.yaml
  become_user: aeyetech

- name: Create Calico configuration
  ansible.builtin.copy:
    dest: /tmp/calico-installation.yml
    content: |
      apiVersion: operator.tigera.io/v1
      kind: Installation
      metadata:
        name: default
      spec:
        calicoNetwork:
          linuxDataplane: BPF
          ipPools:
            - cidr: 10.244.0.0/16
              encapsulation: VXLANCrossSubnet
              natOutgoing: Enabled
              nodeSelector: all()

- name: Install Calico
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/calico-installation.yml
  become_user: aeyetech

- name: Allow workloads on single master node
  ansible.builtin.command:
    cmd: kubectl taint nodes master1 node-role.kubernetes.io/control-plane:NoSchedule-
  become_user: aeyetech
