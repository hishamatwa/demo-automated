---
- name: Create kubeadm configuration
  ansible.builtin.copy:
    dest: /tmp/kubeadm-config.yml
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: InitConfiguration
      localAPIEndpoint:
        advertiseAddress: 192.168.122.11
      nodeRegistration:
        name: master1
        criSocket: unix:///run/containerd/containerd.sock

      ---
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      networking:
        podSubnet: 10.244.0.0/16

- name: Initialize Kubernetes cluster
  ansible.builtin.command:
    cmd: kubeadm init --config=/tmp/kubeadm-config.yml
    creates: /etc/kubernetes/admin.conf

- name: Create kubectl directory
  ansible.builtin.file:
    path: /home/hisham/.kube
    state: directory
    owner: hisham
    group: hisham
    mode: "0755"

- name: Configure kubectl
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/hisham/.kube/config
    remote_src: true
    owner: hisham
    group: hisham
    mode: "0600"
